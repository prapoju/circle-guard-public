apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: circleguard-auth-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['auth-service:8180']
      - job_name: circleguard-identity-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['identity-service:8083']
      - job_name: circleguard-dashboard-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['dashboard-service:8080']
      - job_name: circleguard-notification-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['notification-service:8082']
      - job_name: circleguard-form-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['form-service:8086']
      - job_name: circleguard-file-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['file-service:8085']
      - job_name: circleguard-promotion-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['promotion-service:8088']
      - job_name: circleguard-gateway-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['gateway-service:8087']
  alerts.yml: |
    groups:
      - name: circleguard-critical
        rules:
          - alert: HighErrorRate
            expr: |
              sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[2m]))
              / sum by (application) (rate(http_server_requests_seconds_count[2m])) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High 5xx error rate on {{ $labels.application }}"
              description: "5xx error rate above 5% for more than 2 minutes."
          - alert: HighLatencyP95
            expr: |
              histogram_quantile(0.95, sum by (le, application) (rate(http_server_requests_seconds_bucket[5m]))) > 3
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High p95 latency on {{ $labels.application }}"
              description: "p95 request latency above 3s for more than 2 minutes."
          - alert: PodDown
            expr: up{job=~"circleguard-.*"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Target {{ $labels.job }} is down"
              description: "Prometheus cannot scrape {{ $labels.job }} for more than 1 minute."
          - alert: HighMemoryUsage
            expr: |
              sum by (application) (jvm_memory_used_bytes{area="heap"})
              / sum by (application) (jvm_memory_max_bytes{area="heap"}) > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High JVM heap usage on {{ $labels.application }}"
              description: "JVM heap usage above 85% for more than 5 minutes."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
